name: Node Continuous Integration

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  merge_group:
    branches:
      - main
      - staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  client:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: frontend
      - name: Build
        run: pnpm run build
        working-directory: frontend
      - name: Lint
        run: pnpm run lint
        working-directory: frontend
      - name: Typecheck
        run: pnpm run typecheck
        working-directory: frontend
  #      - name: Test
  #        run: pnpm run test
  #        working-directory: frontend
  server:
    name: Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: backend
      - name: Build
        run: pnpm run build
        working-directory: backend
      - name: Lint
        run: pnpm run lint
        working-directory: backend
      - name: Typecheck
        run: pnpm run typecheck
        working-directory: backend
